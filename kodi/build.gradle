// Embedded Kodi engine (mpvlib-kodi AAR). Inputs are generated by scripts/prepare_kodi.py from an
// official Kodi release pinned in kodi.properties; see README.md.
apply plugin: 'com.android.library'

def kodiProps = new Properties()
file('kodi.properties').withInputStream { kodiProps.load(it) }

version = kodiProps.getProperty('aar.version')

def generatedDir = layout.buildDirectory.dir('generated/kodi').get().asFile

android {
    namespace 'org.xbmc.kodi'
    compileSdk 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            java.srcDirs += new File(generatedDir, 'java')
            res.srcDirs += new File(generatedDir, 'res')
            assets.srcDirs += new File(generatedDir, 'assets')
            jniLibs.srcDirs += new File(generatedDir, 'jniLibs')
        }
    }

    // The official libraries are already stripped (--strip-unneeded) by Kodi's build.
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Used by Kodi's Android TV channel and search code. AARs fetched from GitHub releases carry
    // no dependency metadata, so consuming apps must declare these too.
    implementation 'androidx.tvprovider:tvprovider:1.1.0-alpha01'
    implementation 'com.google.code.gson:gson:2.10.1'
}

// -PkodiSourceDir=<xbmc checkout>, -PkodiAbis=x86,arm64-v8a and -PkodiApk.<abi>=<path> override
// the pinned inputs (for example to package a Kodi source build).
def prepareKodi = tasks.register('prepareKodi', Exec) {
    description = 'Generates Kodi Java glue, resources, native libraries and assets.'
    def script = file('scripts/prepare_kodi.py')
    inputs.file(script)
    inputs.file('kodi.properties')
    inputs.property('overrides', providers.provider {
        project.properties.findAll { k, v -> k.startsWith('kodi') }.collect { k, v -> "$k=$v" }.sort().join(';')
    })
    outputs.dir(generatedDir)

    def args = ['python3', script.absolutePath, '--out', generatedDir.absolutePath]
    if (project.hasProperty('kodiSourceDir')) args += ['--kodi-source', project.property('kodiSourceDir')]
    if (project.hasProperty('kodiAbis')) args += ['--abis', project.property('kodiAbis')]
    project.properties.each { k, v ->
        if (k.startsWith('kodiApk.')) args += ['--apk', "${k.substring('kodiApk.'.length())}=$v"]
    }
    commandLine args
}

tasks.named('preBuild').configure {
    dependsOn prepareKodi
}
