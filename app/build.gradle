apply plugin: 'com.android.library'

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]
ext.universalBase = 8000

version = "1.0.7"

android {
    namespace 'is.xyz.mpv'
    compileSdk 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1000007
        versionName version
    }

    buildFeatures {
        buildConfig = true
    }

    // https://youtrack.jetbrains.com/issue/KT-55947
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
        kotlinOptions.jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

tasks.register('verifyVersionMetadata') {
    doLast {
        def versionsFile = file('src/main/java/is/xyz/mpv/Utils.kt')
        if (versionsFile.text =~ /%[A-Z0-9_]+%/) {
            throw new GradleException(
                    'Native dependency versions were not generated. Build through buildscripts/buildall.sh.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyVersionMetadata')
}

