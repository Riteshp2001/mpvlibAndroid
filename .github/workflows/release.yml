name: release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing SemVer tag, for example v1.0.0 or v1.0.0-rc.1"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      version_tag: ${{ steps.sources.outputs.version_tag }}
      version_name: ${{ steps.sources.outputs.version_name }}
      version_code: ${{ steps.sources.outputs.version_code }}
      library_sha: ${{ steps.sources.outputs.library_sha }}
      no_vulkan_sha: ${{ steps.sources.outputs.no_vulkan_sha }}
      mpv_fongmi_sha: ${{ steps.sources.outputs.mpv_fongmi_sha }}

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            if [[ "${GITHUB_REF}" != refs/heads/library ]]; then
              echo "Manual releases must be run from the library branch."
              exit 1
            fi
            VERSION_TAG="${{ inputs.release_tag }}"
          fi

          if [[ -z "$VERSION_TAG" ]]; then
            echo "Release tag is empty."
            exit 1
          fi

          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.version_tag }}

      - name: Resolve and validate branch commits
        id: sources
        env:
          VERSION_TAG: ${{ steps.tag.outputs.version_tag }}
        run: |
          set -euo pipefail

          git fetch --force origin \
            refs/heads/library:refs/remotes/origin/library \
            refs/heads/no-vulkan:refs/remotes/origin/no-vulkan \
            refs/heads/mpv-fongmi:refs/remotes/origin/mpv-fongmi
          git fetch --force --tags

          bash buildscripts/version.sh validate-tag "$VERSION_TAG"

          LIBRARY_SHA="$(git rev-list -n 1 "$VERSION_TAG")"
          NO_VULKAN_SHA="$(git rev-parse refs/remotes/origin/no-vulkan)"
          MPV_FONGMI_SHA="$(git rev-parse refs/remotes/origin/mpv-fongmi)"
          VERSION_NAME="$(bash buildscripts/version.sh name)"
          VERSION_CODE="$(bash buildscripts/version.sh code)"

          if ! git merge-base --is-ancestor \
              "$LIBRARY_SHA" refs/remotes/origin/library; then
            echo "Tag '$VERSION_TAG' is not on the library branch."
            exit 1
          fi

          MATRIX="$(jq -cn \
            --arg library "$LIBRARY_SHA" \
            --arg no_vulkan "$NO_VULKAN_SHA" \
            --arg mpv_fongmi "$MPV_FONGMI_SHA" \
            '{include: [
              {variant: "library", label: "default Vulkan", artifact: "mpvlib", ref: $library},
              {variant: "no-vulkan", label: "no Vulkan", artifact: "mpvlib-no-vulkan", ref: $no_vulkan},
              {variant: "mpv-fongmi", label: "FongMi", artifact: "mpvlib-fongmi", ref: $mpv_fongmi}
            ]}')"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "library_sha=$LIBRARY_SHA" >> "$GITHUB_OUTPUT"
          echo "no_vulkan_sha=$NO_VULKAN_SHA" >> "$GITHUB_OUTPUT"
          echo "mpv_fongmi_sha=$MPV_FONGMI_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }} AAR
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      CACHE_MODE: folder
      CACHE_FOLDER: ${{ github.workspace }}/gh-cache

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_DISABLE: "true"

      GRADLE_OPTS: >-
        -Xmx4G
        -Dorg.gradle.daemon=false
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true

    steps:
      - name: Checkout ${{ matrix.variant }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Apply release version to variant
        run: |
          set -euo pipefail

          sed -i -E \
            "s|^version = \".*\"$|version = \"${VERSION_NAME}\"|" \
            app/build.gradle
          sed -i -E \
            "s|^([[:space:]]*versionCode[[:space:]]+)[0-9]+$|\1${VERSION_CODE}|" \
            app/build.gradle

          bash buildscripts/version.sh validate-tag "$VERSION_TAG"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export CI environment variables
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - name: Restore Android SDK cache
        id: android-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-sdk.sh') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Restore native prefix cache
        id: native-prefix-cache
        uses: actions/cache/restore@v4
        with:
          path: gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}
          restore-keys: |
            native-prefix-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-${{ matrix.variant }}-${{ matrix.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.variant }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            gcc g++ \
            gettext \
            gperf \
            libtool \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            wget

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade meson jinja2 jsonschema

      - name: Download and restore native dependencies
        run: |
          set -euxo pipefail
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install

      - name: Save Android SDK cache
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-sdk.sh') }}

      - name: Save native prefix cache
        if: steps.native-prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}

      - name: Build release AAR for all Android architectures
        run: |
          set -euxo pipefail
          unset ANDROID_SDK_ROOT
          cd buildscripts

          source include/build_config.sh
          arches=(armv7l arm64)
          [ "$ENABLE_X86_ARCH" = "true" ] && arches+=(x86 x86_64)
          for arch in "${arches[@]}"; do
            ./buildall.sh --arch "$arch" -n mpv
          done

          ./buildall.sh -n mpv-android

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Save ccache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-${{ matrix.variant }}-${{ matrix.ref }}

      - name: Stage ${{ matrix.variant }} release files
        env:
          ARTIFACT_BASE: ${{ matrix.artifact }}
        run: |
          set -euxo pipefail

          AAR_PATH="app/build/outputs/aar/app-release.aar"
          RELEASE_AAR="dist/${ARTIFACT_BASE}-${VERSION_NAME}.aar"
          mkdir -p dist

          if [ ! -f "$AAR_PATH" ]; then
            echo "AAR file not found at: $AAR_PATH"
            find app/build/outputs -type f || true
            exit 1
          fi

          cp "$AAR_PATH" "$RELEASE_AAR"
          (cd dist && sha256sum "${ARTIFACT_BASE}-${VERSION_NAME}.aar" > "${ARTIFACT_BASE}-${VERSION_NAME}.aar.sha256")

      - name: Upload ${{ matrix.variant }} release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: |
            dist/${{ matrix.artifact }}-${{ env.VERSION_NAME }}.aar
            dist/${{ matrix.artifact }}-${{ env.VERSION_NAME }}.aar.sha256
          if-no-files-found: error

  publish:
    name: Publish three-variant release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}

    steps:
      - name: Checkout tagged library source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.library_sha }}

      - name: Download all release variants
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify all release files
        run: |
          set -euo pipefail

          expected=(
            "mpvlib-${VERSION_NAME}.aar"
            "mpvlib-no-vulkan-${VERSION_NAME}.aar"
            "mpvlib-fongmi-${VERSION_NAME}.aar"
          )

          for file in "${expected[@]}"; do
            test -s "dist/$file"
            test -s "dist/$file.sha256"
            (cd dist && sha256sum -c "$file.sha256")
          done

      - name: Generate combined release notes
        env:
          LIBRARY_SHA: ${{ needs.prepare.outputs.library_sha }}
          NO_VULKAN_SHA: ${{ needs.prepare.outputs.no_vulkan_sha }}
          MPV_FONGMI_SHA: ${{ needs.prepare.outputs.mpv_fongmi_sha }}
        run: |
          set -euo pipefail

          RELEASE_NOTES="dist/release-notes-${VERSION_TAG}.md"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${VERSION_TAG}^" 2>/dev/null || true)"

          {
            echo "# mpvlib ${VERSION_TAG}"
            echo ""
            echo "## AAR variants"
            echo ""
            echo "- \`mpvlib-${VERSION_NAME}.aar\` — default Vulkan build"
            echo "- \`mpvlib-no-vulkan-${VERSION_NAME}.aar\` — Vulkan disabled"
            echo "- \`mpvlib-fongmi-${VERSION_NAME}.aar\` — FongMi native profile"
            echo ""
            echo "Each AAR has a matching \`.sha256\` checksum file."
            echo ""
            echo "## Source commits"
            echo ""
            echo "- \`library\`: \`${LIBRARY_SHA}\`"
            echo "- \`no-vulkan\`: \`${NO_VULKAN_SHA}\`"
            echo "- \`mpv-fongmi\`: \`${MPV_FONGMI_SHA}\`"
            echo ""
            echo "## Included Android ABIs"
            echo ""
            echo "- \`armeabi-v7a\`"
            echo "- \`arm64-v8a\`"
            echo "- \`x86\`"
            echo "- \`x86_64\`"
            echo ""
            echo "## Checksums"
            echo ""
            echo '```text'
            cat dist/*.aar.sha256
            echo '```'
            echo ""
            echo "## Commit history"
            echo ""

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Changes from \`${PREVIOUS_TAG}\` to \`${VERSION_TAG}\`:"
              echo ""
              git log \
                --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)) by %an" \
                "${PREVIOUS_TAG}..${VERSION_TAG}"
            else
              git log \
                --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)) by %an" \
                "$VERSION_TAG"
            fi
            echo ""
          } > "$RELEASE_NOTES"

          cat "$RELEASE_NOTES"

      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvlib-${{ env.VERSION_NAME }}-all-variants
          path: |
            dist/*.aar
            dist/*.aar.sha256
            dist/release-notes-${{ env.VERSION_TAG }}.md
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvlib ${{ env.VERSION_TAG }}
          body_path: dist/release-notes-${{ env.VERSION_TAG }}.md
          files: |
            dist/*.aar
            dist/*.aar.sha256
            dist/release-notes-${{ env.VERSION_TAG }}.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
